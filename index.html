<title>Luyện gõ HSK 1–5</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
/* Layout: sticky header (tabs + stats + tools) over a dense practice table that becomes cards on phones */
:root{
  --bg:#f3f6f2; --surface:#ffffff; --fg:#1d2a24; --muted:#5f6f67; --line:#d8e2db;
  --accent:#2f7a55; --accent-ink:#ffffff; --band:#eaf2ec; --input:#fffbea;
  --ok:#2f8a3e; --ok-bg:#dcf2d8; --bad:#b3261e; --bad-bg:#fbe1de;
  --han:"Noto Serif SC","Songti SC","SimSun",serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121815; --surface:#1a221e; --fg:#e4ece6; --muted:#9aaba1; --line:#2c3832;
  --accent:#5fbf8b; --accent-ink:#0d1a13; --band:#1e2823; --input:#2a2716;
  --ok:#7fd88a; --ok-bg:#1f3a22; --bad:#ff8a80; --bad-bg:#3d1f1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --surface:#1a221e; --fg:#e4ece6; --muted:#9aaba1; --line:#2c3832;
  --accent:#5fbf8b; --accent-ink:#0d1a13; --band:#1e2823; --input:#2a2716;
  --ok:#7fd88a; --ok-bg:#1f3a22; --bad:#ff8a80; --bad-bg:#3d1f1c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1000px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header .wrap{padding-block:12px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-size:19px;margin:0;font-weight:700;text-wrap:balance}
h1 span{font-family:var(--han);color:var(--accent);margin-right:6px}
.voice{font-size:12.5px;color:var(--muted);min-width:0}
.voice select{max-width:min(280px,60vw);font:13px var(--body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--bg);color:var(--fg);font:600 14px var(--body);padding:6px 12px;border-radius:999px;cursor:pointer}
.tab small{font-weight:500;color:var(--muted);margin-left:4px}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tab[aria-selected="true"] small{color:inherit;opacity:.8}
.tools{display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center}
.stats{display:flex;gap:14px;font-variant-numeric:tabular-nums;font-size:13.5px}
.stats b{font-size:15px}
.stats .ok b{color:var(--ok)} .stats .bad b{color:var(--bad)}
.tools label{display:flex;align-items:center;gap:6px;font-size:13.5px;cursor:pointer;user-select:none}
#q{flex:1 1 160px;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:6px 10px;font:14px var(--body)}
.btn{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:6px 10px;font:500 13px var(--body);cursor:pointer}
.btn.danger{color:var(--bad)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main .wrap{padding-block:12px 40px}
.head,.row{display:grid;grid-template-columns:56px 110px 130px minmax(0,1fr) 120px 72px;align-items:center}
.head{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 0;border-bottom:2px solid var(--accent)}
.head>div,.row>div{padding:6px 8px}
.row{border-bottom:1px solid var(--line);background:var(--surface)}
.row:nth-child(even){background:var(--band)}
.han{font-family:var(--han);font-size:24px;font-weight:500}
body.hide .row .han{color:transparent;text-shadow:none;background:var(--line);border-radius:6px;user-select:none}
body.hide .row.ok .han{color:var(--fg);background:none}
.py{color:var(--accent);font-weight:500}
.vi{min-width:0}
.say{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;color:var(--accent)}
.say:hover{border-color:var(--accent)}
.say.on{background:var(--accent);color:var(--accent-ink)}
.say svg{width:18px;height:18px}
.row input{width:100%;font:500 20px var(--han);padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--input);color:var(--fg)}
.c-in{position:relative}
.cand{position:absolute;left:8px;top:calc(100% - 2px);z-index:4;min-width:220px;max-width:min(320px,calc(100vw - 40px));background:var(--surface);border:1px solid var(--accent);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.15);padding:4px;display:flex;flex-direction:column}
.cand .buf{font-size:12px;color:var(--muted);padding:2px 8px 4px;border-bottom:1px solid var(--line);margin-bottom:2px}
.cand button{display:flex;align-items:baseline;gap:8px;border:0;background:none;color:var(--fg);text-align:left;padding:5px 8px;border-radius:6px;cursor:pointer;font:14px var(--body)}
.cand button i{font-style:normal;color:var(--muted);font-size:12px;width:12px;font-variant-numeric:tabular-nums}
.cand button b{font:500 20px var(--han)}
.cand button span{color:var(--muted);font-size:12.5px}
.cand button.sel{background:var(--band)}
.cand .none{padding:6px 8px;color:var(--muted);font-size:13px}
.mark{font-size:13px;font-weight:700;border-radius:999px;padding:3px 0;text-align:center}
.row.ok .mark{background:var(--ok-bg);color:var(--ok)}
.row.bad .mark{background:var(--bad-bg);color:var(--bad)}
.empty{padding:30px 0;color:var(--muted);text-align:center}
.confirm{display:flex;gap:8px;align-items:center;font-size:13px}
@media (max-width:640px){
  .head{display:none}
  .row{grid-template-columns:48px auto minmax(0,1fr);grid-template-areas:"say han py" "say vi vi" "in in mk";padding:6px 0}
  .row>div{padding:4px 6px}
  .c-say{grid-area:say;align-self:start}.c-han{grid-area:han}.c-py{grid-area:py}.c-vi{grid-area:vi}.c-in{grid-area:in}.c-mk{grid-area:mk;width:72px}
}
@media (prefers-reduced-motion:no-preference){.say{transition:background .15s,border-color .15s}}
</style>

</head>
<body>
<header><div class="wrap">
  <div class="top"><h1><span>汉字</span>Luyện gõ từ vựng HSK</h1><span class="voice" id="voice">Bấm loa để nghe phát âm.</span></div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="tools">
    <div class="stats"><span>Đã gõ <b id="sTyped">0</b>/<span id="sTotal">0</span></span><span class="ok">Đúng <b id="sOk">0</b></span><span class="bad">Sai <b id="sBad">0</b></span><span>Tỉ lệ <b id="sPct">–</b></span></div>
    <label><input type="checkbox" id="hide"> Ẩn chữ Hán</label>
    <label><input type="checkbox" id="slow" checked> Đọc chậm</label>
    <input id="q" type="search" placeholder="Tìm chữ Hán, phiên âm, nghĩa…">
    <span id="resetBox"><button class="btn danger" id="reset">Xóa bài đã gõ</button></span>
  </div>
</div></header>

<main><div class="wrap">
  <div class="head"><div>Nghe</div><div>Chữ Hán</div><div>Phiên âm</div><div>Tiếng Việt</div><div>Gõ ở đây</div><div>Check</div></div>
  <div id="list"></div>
</div></main>

};

// --- speech ---
let zhVoice = null, mandarin = [];
// Chỉ nhận giọng phổ thông (Mandarin); loại giọng Hồng Kông / Quảng Đông
function voiceScore(v){
  const lang = v.lang.replace("_","-"), name = v.name;
  if(/HK|MO|yue/i.test(lang) || /cantonese|粤|廣東|香港/i.test(name)) return -1;
  let s;
  if(/^(zh|cmn)(-Hans)?-CN/i.test(lang)) s = 100;
  else if(/^(zh|cmn)(-Hant)?-TW/i.test(lang)) s = 40;
  else if(/^(zh|cmn)/i.test(lang)) s = 30;
  else return -1;
  if(/natural|online|premium|enhanced|neural/i.test(name)) s += 20;
  if(/google|xiaoxiao|yunxi|tingting|lilian|yu-shu|普通话/i.test(name)) s += 10;
  return s;
}
function pickVoice(){
  if(!window.speechSynthesis){ $("voice").textContent = "Trình duyệt này không hỗ trợ đọc. Hãy thử Chrome, Edge hoặc Safari."; return; }
  const vs = speechSynthesis.getVoices();
  mandarin = vs.map(v=>({v, s:voiceScore(v)})).filter(x=>x.s>=0).sort((a,b)=>b.s-a.s).map(x=>x.v);
  const saved = store.get("voice");
  zhVoice = mandarin.find(v=>v.name===saved) || mandarin[0] || null;
  if(vs.length && !mandarin.length){
    $("voice").textContent = "Máy chưa có giọng tiếng Trung phổ thông. Hãy cài giọng Chinese (Mandarin, Trung Quốc đại lục) trong cài đặt ngôn ngữ của máy.";
    return;
  }
  if(!mandarin.length) return;
  $("voice").innerHTML = `<label for="vsel">Giọng đọc</label> <select id="vsel">${mandarin.map((v,i)=>
    `<option value="${i}" ${v===zhVoice?"selected":""}>${v.name} (${v.lang})</option>`).join("")}</select>`;
  $("vsel").onchange = e => { zhVoice = mandarin[+e.target.value]; store.set("voice", zhVoice.name); say("你好"); };
}
if(window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text, btn){
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.split("/")[0]);
  u.lang = "zh-CN"; if(zhVoice) u.voice = zhVoice;
  u.rate = $("slow").checked ? 0.7 : 1;
  document.querySelectorAll(".say.on").forEach(b=>b.classList.remove("on"));
  if(btn){ btn.classList.add("on"); u.onend = u.onerror = ()=>btn.classList.remove("on"); }
  speechSynthesis.speak(u);
}

// --- check ---
function judge(han, typed){
  const t = typed.trim(); if(!t || /[a-zü]/i.test(t)) return "";
  return (t===han || han.split("/").includes(t)) ? "ok" : "bad";
}
const key = (lv,h) => lv+"|"+h;

function tabs(){
  $("tabs").innerHTML = Object.keys(DATA).map(lv =>
    `<button class="tab" role="tab" id="tab${lv}" aria-selected="${lv===level}" data-lv="${lv}">HSK ${lv}<small>${DATA[lv].length}</small></button>`).join("");
}
function render(){
  const q = $("q").value.trim().toLowerCase();
  const strip = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d").toLowerCase();
  const qs = strip(q);
  const rows = DATA[level].filter(([h,p,v,s]) => !q || h.includes(q) || strip(p).replace(/'/g,"").includes(qs.replace(/\s/g,"")) || strip(v).includes(qs));
  $("list").innerHTML = rows.length ? rows.map(([h,p,v,s]) => {
    const a = answers[key(level,h)] || ""; const st = judge(h,a);
    return `<div class="row ${st}" data-h="${h}" data-s="${s||h}">
      <div class="c-say"><button class="say" aria-label="Nghe ${h}" data-s="${s||h}">${spk}</button></div>
      <div class="c-han han">${h}</div><div class="c-py py">${p}</div><div class="c-vi vi">${v}</div>
      <div class="c-in"><input id="in-${level}-${h}" value="${a.replace(/"/g,"&quot;")}" aria-label="Gõ chữ Hán cho ${p}" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
      <div class="c-mk mark">${st==="ok"?"Đúng":st==="bad"?"Sai":""}</div></div>`;
  }).join("") : `<div class="empty">Không tìm thấy từ nào khớp “${q}”.</div>`;
  stats();
}
function stats(){
  let typed=0, ok=0;
  for(const [h] of DATA[level]){ const a=answers[key(level,h)]; if(a&&a.trim()){typed++; if(judge(h,a)==="ok") ok++;} }
  $("sTyped").textContent=typed; $("sTotal").textContent=DATA[level].length;
  $("sOk").textContent=ok; $("sBad").textContent=typed-ok;
  $("sPct").textContent = typed ? Math.round(ok/typed*100)+"%" : "–";
}

$("tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab"); if(!b) return;
  level = b.dataset.lv; store.set("lv",level); tabs(); render(); window.scrollTo(0,0);
});
$("list").addEventListener("click", e => { const b=e.target.closest(".say"); if(b) say(b.dataset.s,b); });
// --- pinyin suggestions ---
const norm = s => s.toLowerCase().replace(/ü/g,"u").replace(/v/g,"u").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z]/g,"");
const INDEX = [];
{ const seen = new Set();
  for(const lv of Object.keys(DATA)) for(const [h,p,v] of DATA[lv]){
    const hs = h.split("/"), ps = p.split("/");
    hs.forEach((hh,i) => { if(seen.has(hh)) return; seen.add(hh);
      const pp = ps[i] || ps[0]; INDEX.push({h:hh, p:pp, k:norm(pp), lv:+lv}); });
  }
  for(const [h,p] of CHARS) if(!seen.has(h)){ seen.add(h); INDEX.push({h, p, k:norm(p), lv:9}); }
}
function lookup(k){
  // whole input matches a word → show those; otherwise suggest characters for the longest leading syllable
  const rank = (a,b) => (a.k!==k2)-(b.k!==k2) || a.h.length-b.h.length || a.lv-b.lv;
  let k2 = k, items = INDEX.filter(x => x.k.startsWith(k));
  if(items.length) return {items: items.sort(rank).slice(0,9), used: k.length};
  for(let n = k.length-1; n >= 1; n--){
    k2 = k.slice(0,n);
    items = INDEX.filter(x => x.k === k2);
    if(items.length) return {items: items.sort(rank).slice(0,9), used: n};
  }
  return {items: [], used: k.length};
}
const cand = {el:null, input:null, items:[], sel:0, raw:""};
function hideCand(){ if(cand.el) cand.el.remove(); cand.el=null; cand.input=null; cand.items=[]; }
function showCand(input){
  const m = input.value.match(/[a-zA-ZüÜ]+$/);
  const k = m ? norm(m[0]) : "";
  if(!k){ hideCand(); return; }
  const {items, used} = lookup(k);
  cand.input = input; cand.items = items; cand.sel = 0; cand.raw = m[0]; cand.used = used;
  if(!cand.el){ cand.el = document.createElement("div"); cand.el.className = "cand"; cand.el.setAttribute("role","listbox"); }
  input.parentNode.appendChild(cand.el);
  cand.el.innerHTML = `<div class="buf">${m[0]}</div>` + (items.length
    ? items.map((x,i) => `<button type="button" data-i="${i}" class="${i===0?"sel":""}"><i>${i+1}</i><b>${x.h}</b><span>${x.p}</span></button>`).join("")
    : `<div class="none">Không có chữ nào khớp.</div>`);
}
function pickCand(i){
  const x = cand.items[i], input = cand.input; if(!x || !input) return;
  const start = input.value.length - cand.raw.length;
  input.value = input.value.slice(0, start) + x.h + cand.raw.slice(cand.used);
  input.dispatchEvent(new Event("input", {bubbles:true}));
  input.focus();
}
function moveSel(d){
  if(!cand.items.length) return;
  cand.sel = (cand.sel + d + cand.items.length) % cand.items.length;
  cand.el.querySelectorAll("button").forEach((b,i) => b.classList.toggle("sel", i===cand.sel));
}
$("list").addEventListener("mousedown", e => { const b = e.target.closest(".cand button"); if(b){ e.preventDefault(); pickCand(+b.dataset.i); } });
$("list").addEventListener("focusout", e => { if(e.target.matches("input")) setTimeout(() => { if(document.activeElement !== cand.input) hideCand(); }, 150); });

$("list").addEventListener("input", e => {
  if(e.target.matches("input") && !e.isComposing) showCand(e.target);
  const row = e.target.closest(".row"); if(!row) return;
  const h = row.dataset.h, v = e.target.value;
  if(v) answers[key(level,h)] = v; else delete answers[key(level,h)];
  store.set("ans",answers);
  const st = judge(h,v); row.className = "row "+st;
  row.querySelector(".mark").textContent = st==="ok"?"Đúng":st==="bad"?"Sai":"";
  stats();
});
$("list").addEventListener("keydown", e => {
  if(e.isComposing || !e.target.matches("input")) return;
  if(cand.el && cand.input === e.target){
    if(/^[1-9]$/.test(e.key) && cand.items[+e.key-1]){ e.preventDefault(); pickCand(+e.key-1); return; }
    if((e.key===" " || e.key==="Enter") && cand.items.length){ e.preventDefault(); pickCand(cand.sel); return; }
    if(e.key==="ArrowDown"){ e.preventDefault(); moveSel(1); return; }
    if(e.key==="ArrowUp"){ e.preventDefault(); moveSel(-1); return; }
    if(e.key==="Escape"){ hideCand(); return; }
  }
  if(e.key!=="Enter") return;
  e.preventDefault();
  const next = e.target.closest(".row").nextElementSibling;
  if(next){ const i=next.querySelector("input"); i.focus(); i.scrollIntoView({block:"center"}); if($("hide").checked) say(next.dataset.s); }
});
$("hide").addEventListener("change", e => { document.body.classList.toggle("hide", e.target.checked); store.set("hide",e.target.checked); });
$("slow").addEventListener("change", e => store.set("slow",e.target.checked));
$("q").addEventListener("input", render);
$("resetBox").addEventListener("click", e => {
  if(e.target.id==="reset"){
    $("resetBox").innerHTML = `<span class="confirm">Xóa hết bài đã gõ ở HSK ${level}? <button class="btn danger" id="yes">Xóa</button><button class="btn" id="no">Thôi</button></span>`;
  } else if(e.target.id==="yes" || e.target.id==="no"){
    if(e.target.id==="yes"){ for(const [h] of DATA[level]) delete answers[key(level,h)]; store.set("ans",answers); render(); }
    $("resetBox").innerHTML = `<button class="btn danger" id="reset">Xóa bài đã gõ</button>`;
  }
});

if(store.get("hide")){ $("hide").checked = true; document.body.classList.add("hide"); }
if(store.get("slow")===false) $("slow").checked = false;
tabs(); render();
</script>

if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
</script>
